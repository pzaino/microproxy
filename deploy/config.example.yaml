# MicroProxy typed configuration example
#
# This file is intentionally a single valid config plus explicit scenario blocks.
# Copy one scenario block at a time (single provider / failover / selenium downstream)
# into the active sections below when building environment-specific configs.
#
# Sticky-session profile (VDI):
#   :8080 edge-http        -> rotating provider (unchanged behaviour)
#   :8081 edge-http-sticky -> sticky provider (session-managed, one logical
#                            session per microproxy process)
#   127.0.0.1:8094        -> authenticated data-plane session management API
# CROWler contract: close old browser -> POST /api/v1/sessions/rotate
#   with Idempotency-Key -> wait for 200 -> start next browser.

schema_version: "1"

# listeners: ingress interfaces that accept downstream client traffic.
# `provider` (optional) hard-binds a listener to one upstream provider. When
# set it is a mandatory egress constraint: X-Provider-ID, routing rules and
# policy route_override cannot escape it. Empty preserves legacy routing.
listeners:
  - name: edge-http
    type: http
    address: 0.0.0.0:8080
    provider: corp-http-primary
    # rate_limit is a per-listener request/second token bucket (burst equal to
    # the rate). Excess requests receive 429 Too Many Requests with a
    # Retry-After header. 0/omitted disables limiting; a SOCKS5 listener applies
    # the same limit per accepted connection.
    rate_limit: 500
    auth_type: basic
    username: ${MICROPROXY_LISTENER_USER}
    password: ${MICROPROXY_LISTENER_PASSWORD}
    enabled: true

  - name: edge-http-sticky
    type: http
    address: 0.0.0.0:8081
    provider: corp-http-sticky
    rate_limit: 500
    auth_type: none
    enabled: true

providers:
  - name: corp-http-primary
    type: http_proxy
    auth:
      type: basic
      username: ${MICROPROXY_HTTP_PROXY_USER}
      password: ${MICROPROXY_HTTP_PROXY_PASSWORD}
    endpoints:
      - url: http://proxy-a.internal:3128
        priority: 100
        weight: 3
      - url: http://proxy-b.internal:3128
        priority: 110
        weight: 1
    capabilities: ["forward_proxy"]
    health:
      enabled: true
      check_path: /healthz
      interval_seconds: 15
      timeout_seconds: 2
      failure_threshold: 3

  - name: corp-http-backup
    type: http_proxy
    auth:
      type: basic
      username: ${MICROPROXY_HTTP_PROXY_USER}
      password: ${MICROPROXY_HTTP_PROXY_PASSWORD}
    endpoints:
      - url: http://proxy-c.internal:3128
        priority: 200
        weight: 1
    capabilities: ["forward_proxy"]
    health:
      enabled: true
      check_path: /healthz
      interval_seconds: 15
      timeout_seconds: 2
      failure_threshold: 3

  - name: corp-http-sticky
    type: http_proxy
    auth:
      type: basic
      # Base username WITHOUT a session suffix. The runtime renders
      # "{{username}}-session-{{session_id}}" per pinned identity.
      username: ${MICROPROXY_HTTP_PROXY_USER}
      password: ${MICROPROXY_HTTP_PROXY_PASSWORD}
    session:
      supported: true
      mode: username_template
      username_template: "{{username}}-session-{{session_id}}"
    endpoints:
      - url: http://proxy-a.internal:3128
        priority: 100
        weight: 1
    capabilities: ["forward_proxy"]
    health:
      enabled: false

routing:
  default_provider: corp-http-primary
  rules:
    # Single-provider scenario: everything routes through a single upstream.
    - name: scenario-single-provider
      match:
        tenant_id: tenant-single
      provider: corp-http-primary
      policy_ref: allow-default

    # Multi-provider failover scenario: route selected traffic to backup.
    - name: scenario-failover-for-critical
      match:
        tenant_id: tenant-failover
        host_suffix: .critical.example.com
      provider: corp-http-backup
      policy_ref: allow-default

    # Selenium-friendly downstream: no listener auth, upstream auth only.
    # Use listener profile below by setting auth_type:none and clearing credentials.
    - name: scenario-selenium-friendly
      match:
        tenant_id: tenant-selenium
      provider: corp-http-primary
      policy_ref: allow-default

policies:
  - name: allow-default
    type: base
    action: allow

  # Policy snippet: block known media/video URLs.
  - name: deny-video-url-patterns
    type: content
    action: deny
    selectors:
      url_regex: '(?i).*(\\.mp4|\\.m3u8|\\.webm|\\.mov)(\\?.*)?$'
    parameters:
      reason_code: media_block_url
      reason: blocked by URL media extension policy
      deny_category: content

  # Policy snippet: block media/video by response content-type.
  - name: deny-video-content-type
    type: content
    action: deny
    selectors:
      content_type_regex: '(?i)^(video/.*|application/vnd\\.apple\\.mpegurl|application/x-mpegurl)'
    parameters:
      reason_code: media_block_content_type
      reason: blocked by response Content-Type policy
      deny_category: content

  # Example header patch (correctly uses headers_patch action; not redirect).
  - name: strip-sensitive-request-headers
    type: header
    action: headers_patch
    selectors:
      phase: request
    parameters:
      authorization: ""
      x-api-key: ""
      cookie: ""

policy_engine:
  chain_mode: continue
  safe_mode:
    allow_request_header_mutation: true
    allow_response_header_mutation: false
    allow_redirect_rewrite: false
    allow_body_mutation: false

tenants:
  - name: tenant-single
    id: tenant-single
    providers: [corp-http-primary]
    policies: [allow-default]
  - name: tenant-failover
    id: tenant-failover
    providers: [corp-http-primary, corp-http-backup]
    policies: [allow-default, deny-video-url-patterns, deny-video-content-type]
  - name: tenant-selenium
    id: tenant-selenium
    providers: [corp-http-primary]
    policies: [allow-default]
  - name: tenant-sticky
    id: tenant-sticky
    providers: [corp-http-sticky]
    policies: [allow-default]

# session_control: data-plane-local sticky session management API.
# Disabled by default; enable only with a strong bearer token and loopback
# (or private-network) binding. It rotates the SAME process that serves :8081.
# microproxy-control provider rotation stubs are a separate contract and do not
# mutate this runtime.
# listener auth_type protects downstream proxy clients; session_control
# auth_type protects this management API. They are independent.
# auth_type: bearer (default when omitted) requires a non-empty bearer_token.
# auth_type: none is loopback-only unless allow_unauthenticated_non_loopback is
# explicitly set for a protected private network. An empty bearer_token never
# implies none.
session_control:
  enabled: true
  address: 127.0.0.1:8094
  auth_type: bearer
  bearer_token: ${MICROPROXY_SESSION_API_KEY}
  # allow_unauthenticated_non_loopback: false
  provider: corp-http-sticky

observability:
  access_log:
    enabled: true
    format: json
  metrics:
    enabled: true
    address: 0.0.0.0:9091
  tracing:
    enabled: false
    exporter: otlp
    endpoint: otel-collector.monitoring.svc.cluster.local:4317
  health_endpoints:
    # -health-addr, when non-empty, overrides liveness_address and the effective
    # configuration is revalidated before listeners start. Omit the flag to keep
    # this YAML value.
    liveness_address: 0.0.0.0:9090
    readiness_address: 0.0.0.0:9092
    startup_address: 0.0.0.0:9093

# --- Scenario-only snippets (copy into active sections as needed) ---
# single-provider:
#   listeners[0].auth_type: basic
#   routing.default_provider: corp-http-primary
#
# multi-provider-failover:
#   providers: corp-http-primary + corp-http-backup
#   routing.rules: include scenario-failover-for-critical
#
# selenium-friendly-downstream:
#   listeners[0].auth_type: none
#   listeners[0].username/password: removed
#   providers[*].auth: keep upstream auth enabled
#
# sticky-vdi:
#   listeners: edge-http (:8080, provider proxyservice-residential) +
#              edge-http-sticky (:8081, provider proxyservice-residential-sticky, auth none)
#   providers: proxyservice-residential (static basic) +
#              proxyservice-residential-sticky (session mode username_template)
#   session_control: 127.0.0.1:8094, auth_type bearer, bearer ${MICROPROXY_SESSION_API_KEY}
#   CROWler: close browser -> POST rotate (Idempotency-Key) -> 200 -> start browser
#   Latest-key replay: 200 + replayed=true; older key: 409 stale_idempotency_key
#
# credential-template (generic, provider-independent):
#   providers: a credential_template provider renders username and/or password
#   from base credentials, static parameters and the pinned session id.
#   - Bright Data-style (username only, password stays base):
#       providers:
#         - name: brightdata-geo
#           type: http_proxy
#           auth:
#             type: basic
#             username: ${BD_USER}
#             password: ${BD_PASSWORD}
#             templates:
#               username: "{{username}}.{{session_id}}{{region}}"
#             parameters:
#               region: { source: endpoint.region }
#           session:
#             supported: true
#             mode: credential_template
#             id: { length: 10, charset: alphanumeric }
#           endpoints:
#             - { url: http://gateway.example:8000, country: US, region: FL,
#                 priority: 100, weight: 3 }
#   - Evomi-style (password only, username stays base):
#       auth:
#         type: basic
#         username: ${EVOMI_USER}
#         password: ${EVOMI_PASSWORD}
#         templates:
#           password: "{{password}}-{{session_id}}"
#       session: { supported: true, mode: credential_template }
#   Notes:
#   - mode credential_template and the legacy session.username_template are
#     mutually exclusive; credential_template mode requires a template that
#     references {{session_id}} and basic upstream auth with non-empty base
#     credentials.
#   - templating requires an http_proxy-compatible provider (direct/socks5
#     rejected); see docs/generic-credential-templates.md.
#   - session.id configures the sticky identifier (length 1..128, default 32
#     lowercase hex; charset one of hex, hex_upper, numeric, alpha,
#     alpha_mixed, alphanumeric, alphanumeric_low, urlsafe).
