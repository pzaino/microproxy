services:
  microproxy:
    build:
      context: .
      dockerfile: Dockerfile.mp
    image: microproxy:local
    container_name: microproxy
    restart: unless-stopped
    ports:
      - "8084:8080" # downstream rotating proxy listener (:8080)
      - "8086:8081" # downstream sticky proxy listener (:8081, session-managed)
      - "8094:8094" # data-plane session management API (loopback/private only, authenticated)
      - "8090:8090" # liveness
      - "8091:8091" # metrics
      - "8092:8092" # readiness
      - "8093:8093" # startup
    env_file:
      - ./controlplane.env
      #- ../thecrowler/.env
    environment:
      MICROPROXY_DEVELOPMENT_MODE: "true"
    volumes:
      - ./config.yaml:/etc/microproxy/config.yaml:ro
    command: ["-config", "/etc/microproxy/config.yaml", "-health-addr", ":8090"]

  microproxy-control:
    build:
      context: .
      dockerfile: Dockerfile.mp-ctrl
    image: microproxy-control:local
    container_name: microproxy-control
    env_file:
      - ./controlplane.env
      #- ../thecrowler/.env
    ports:
      - "8085:8081" # control-plane API
    volumes:
      - ./config.yaml:/etc/microproxy/config.yaml:ro
    command: ["-config", "/etc/microproxy/config.yaml", "-listen-addr", ":8081"]
