services:
  microproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: microproxy:local
    container_name: microproxy
    restart: unless-stopped
    ports:
      - "8084:8080" # downstream proxy listener
      - "8085:8081" # control-plane API
      - "8090:8090" # liveness
      - "8091:8091" # metrics
      - "8092:8092" # readiness
      - "8093:8093" # startup
    env_file:
      - ./controlplane.env
      #- ../thecrowler/.env
    environment:
      MICROPROXY_DEVELOPMENT_MODE: "true"
    volumes:
      - ./config.yaml:/etc/microproxy/config.yaml:ro
    command: ["-config", "/etc/microproxy/config.yaml", "-health-addr", ":8090"]
